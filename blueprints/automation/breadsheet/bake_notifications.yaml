blueprint:
  name: Breadsheet step notifications for active recipes
  description: >-
    When you start a recipe schedule on breadsheet.com, this blueprint displays a live activity for each step on your phone's lock screen.
  domain: automation
  source_url: https://github.com/brystmar/breadsheet-hass/blob/main/blueprints/automation/breadsheet/bake_notifications.yaml
  author: brystmar
  homeassistant:
    min_version: "2026.11.0"
  input:
    notify_services:
      name: Phones to Notify
      description: >-
        The notify action of the Home Assistant companion app on each phone. Find it under Settings > Tools > Actions. Example:
        notify.mobile_app_my_phone
      selector:
        text:
          multiple: true
    send_upcoming:
      name: Warn Before Each Step?
      description: A notification ahead of each step, at the integration's lead time.
      default: false
      selector:
        boolean:
    send_late:
      name: Remind When Late?
      description: A notification if a step isn't done 5 minutes after it was due.
      default: true
      selector:
        boolean:
    live_activities:
      name: Live Activities (iOS) and Live Updates (Android)
      description: >-
        Shows a live card on your lock screen for each active recipe, counting down to its next step. It ends during waits over 4 hours and comes back before the next
        step, then clears when the bake ends.
      default: true
      selector:
        boolean:

# Queued, with a pause after each notification: steps due in the same minute arrive as separate notifications,
# a second or two apart, in step order (the integration fires their events in order).
mode: queued
max: 50
max_exceeded: silent

triggers:
  - trigger: event
    event_type: breadsheet_step_upcoming
    id: upcoming
  - trigger: event
    event_type: breadsheet_step_due
    id: due
  - trigger: event
    event_type: breadsheet_step_late
    id: late
  - trigger: event
    event_type: mobile_app_notification_action
    id: done
  - trigger: event
    event_type: breadsheet_bake_changed
    id: changed
  - trigger: event
    event_type: breadsheet_bake_ended
    id: ended
  # Once a minute per active bake: moves Android's progress bar, which only changes when the card is sent again
  - trigger: event
    event_type: breadsheet_bake_progress
    id: tick

variables:
  notify_services: !input notify_services
  send_upcoming: !input send_upcoming
  send_late: !input send_late
  live_activities: !input live_activities
  # Done buttons carry the bake and step in their action id: BREADSHEET_DONE|<bake id>|<position>
  done_parts: >-
    {{ (trigger.event.data.action | default('')).split('|') if trigger.id == 'done' else [] }}

conditions:
  - condition: template
    value_template: >-
      {{ (trigger.id == 'upcoming' and (send_upcoming or live_activities))
         or trigger.id == 'due'
         or (trigger.id == 'late' and send_late)
         or (trigger.id in ['changed', 'ended', 'tick'] and live_activities)
         or (trigger.id == 'done' and done_parts | length == 3 and done_parts[0] == 'BREADSHEET_DONE') }}

actions:
  # A Done button: check the step off
  - if:
      - condition: trigger
        id: done
    then:
      - action: breadsheet.complete_step
        data:
          bake_id: "{{ done_parts[1] }}"
          position: "{{ done_parts[2] | int }}"
      - stop: Checked off

  # A bake ended (finished, canceled, expired, or switched to Simple): its card must go (Android has no expiry),
  # and so must its step notifications, whose Done buttons would otherwise outlive the bake
  - if:
      - condition: trigger
        id: ended
    then:
      - variables:
          tags: >-
            {{ ['breadsheet_' ~ trigger.event.data.bake_id]
               + range(1, (trigger.event.data.steps_total | default(0) | int) + 1)
                 | map('string') | map('regex_replace', '^', 'breadsheet_' ~ trigger.event.data.bake_id ~ '_')
                 | list }}
      - repeat:
          for_each: "{{ notify_services }}"
          sequence:
            - variables:
                phone: "{{ repeat.item }}"
            - repeat:
                for_each: "{{ tags }}"
                sequence:
                  - action: "{{ phone }}"
                    continue_on_error: true
                    data:
                      message: clear_notification
                      data:
                        tag: "{{ repeat.item }}"
      - stop: Cleared

  # Step notifications
  - if:
      - condition: template
        value_template: "{{ trigger.id in ['due', 'late'] or (trigger.id == 'upcoming' and send_upcoming) }}"
    then:
      - variables:
          step: "{{ trigger.event.data }}"
          # Step text comes from recipes other people write: it's only ever shown, never used as a template
          due_time: "{{ as_timestamp(step.scheduled_at) | timestamp_custom('%-I:%M %p') }}"
          message: >-
            {% if trigger.id == 'upcoming' %}At {{ due_time }}: {{ step.text }}
            {% elif trigger.id == 'due' %}Now: {{ step.text }}
            {% else %}Still to do (due {{ due_time }}): {{ step.text }}{% endif %}
          subtitle: "Step {{ step.position }} of {{ step.steps_total }}"
      - repeat:
          for_each: "{{ notify_services }}"
          sequence:
            - action: "{{ repeat.item }}"
              continue_on_error: true
              data:
                title: "{{ step.bake_name }}"
                message: "{{ message | trim }}"
                data:
                  subtitle: "{{ subtitle }}"
                  # One notification per step: the due one replaces the warning, the late one replaces both
                  tag: "breadsheet_{{ step.bake_id }}_{{ step.position }}"
                  group: "breadsheet_{{ step.bake_id }}"
                  url: "/breadsheet/{{ step.bake_id }}"
                  clickAction: "/breadsheet/{{ step.bake_id }}"
                  actions:
                    - action: "BREADSHEET_DONE|{{ step.bake_id }}|{{ step.position }}"
                      title: Done
      - delay:
          milliseconds: 1500

  # The Live Activity / Live Update: one card per bake (tag breadsheet_<bake id>), counting down to the next step,
  # with a progress bar for the step whose wait is running. Sent when a step starts or the next step's time changes
  # (breadsheet_bake_changed), brought back by the warning before a step that follows a wait over 4 hours, and on
  # Android refreshed every minute (breadsheet_bake_progress).
  #
  # iPhones and Android phones get different fields. iOS fills the bar on its own from the countdown, but restarts
  # it from empty on every update, so iPhones only get updates at the start of a step. Android's bar shows whatever
  # was last sent, so Android phones get the seconds elapsed, every minute. A phone is an iPhone when its companion
  # app device in Home Assistant is made by Apple; anything else (or a notify action that isn't one phone's) is
  # treated as Android.
  - if:
      - condition: template
        value_template: "{{ live_activities and trigger.id in ['changed', 'upcoming', 'tick'] }}"
    then:
      - variables:
          event: "{{ trigger.event.data }}"
          card:
            bake_id: "{{ event.bake_id }}"
            name: "{{ event.bake_name }}"
            position: "{{ event.position if trigger.id == 'upcoming' else event.next_position }}"
            text: "{{ event.text if trigger.id == 'upcoming' else event.next_text }}"
            at: "{{ event.scheduled_at if trigger.id == 'upcoming' else event.next_scheduled_at }}"
            started: "{{ event.wait_started_at | default(none) }}"
            total: "{{ event.steps_total }}"
          seconds_left: "{{ (as_timestamp(card.at) - as_timestamp(now())) | int if card.at else none }}"
          # How long the step's wait is, and how far into it we are; none for the first step, which no wait leads to
          length: "{{ (as_timestamp(card.at) - as_timestamp(card.started)) | int if card.at and card.started else none }}"
          elapsed: >-
            {{ [[(as_timestamp(now()) - as_timestamp(card.started)) | int, 0] | max, length] | min
               if length is not none else none }}
          long_wait: "{{ length is none or length > 4 * 3600 }}"
          # Clear before waits over 4 hours (Apple ends activities after 8, and starts are budgeted) and when
          # nothing is left; leave alone a step due within a minute (zero-wait steps get no update). The warning
          # before a step only brings back a card that a long wait cleared, and the minute ticks only refresh a
          # card that's showing.
          verdict: >-
            {% if card.position is none or card.at is none %}{{ 'clear' if trigger.id == 'changed' else 'skip' }}
            {% elif seconds_left > 4 * 3600 %}{{ 'clear' if trigger.id == 'changed' else 'skip' }}
            {% elif seconds_left < 60 %}skip
            {% elif trigger.id == 'upcoming' and not long_wait %}skip
            {% elif trigger.id == 'tick' and long_wait %}skip
            {% else %}show{% endif %}
          # The notify actions of iPhones: companion app devices made by Apple
          iphones: >-
            {% set ns = namespace(found=[]) %}
            {% for device in integration_entities('mobile_app') | map('device_id') | reject('none') | unique %}
              {% if device_attr(device, 'manufacturer') == 'Apple' %}
                {% set ns.found = ns.found + ['notify.mobile_app_' ~ (device_attr(device, 'name') | slugify)] %}
              {% endif %}
            {% endfor %}
            {{ ns.found }}
          label: >-
            {{ (card.text.split() | first | default('Step'))[:12] if card.text else 'Step' }} {{ card.position }}/{{ card.total }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ verdict | trim == 'show' }}"
            sequence:
              - repeat:
                  for_each: "{{ notify_services }}"
                  sequence:
                    - if:
                        - condition: template
                          value_template: "{{ repeat.item in iphones }}"
                      then:
                        # iOS: no progress value, so the bar fills on its own over the countdown. Not on ticks,
                        # which would restart it
                        - if:
                            - condition: template
                              value_template: "{{ trigger.id != 'tick' }}"
                          then:
                            - action: "{{ repeat.item }}"
                              continue_on_error: true
                              data:
                                title: "{{ card.name }}"
                                message: "{{ card.text }}"
                                data:
                                  tag: "breadsheet_{{ card.bake_id }}"
                                  live_update: true
                                  critical_text: "{{ label }}"
                                  chronometer: true
                                  when: "{{ as_timestamp(card.at) | int }}"
                                  when_relative: false
                                  progress_bar_direction: increasing
                                  notification_icon: mdi:bread-slice
                                  notification_icon_color: "#B5762E"
                                  # Quiet updates: the step notifications already alert. iOS ignores silent on the
                                  # first update (the start)
                                  silent: true
                                  url: "/breadsheet/{{ card.bake_id }}"
                      else:
                        # Android: the seconds into the step's wait, out of its length (-1: no bar for the first
                        # step, which no wait leads to)
                        - action: "{{ repeat.item }}"
                          continue_on_error: true
                          data:
                            # Android needs the title on every update, or it posts a plain banner instead
                            title: "{{ card.name }}"
                            message: "{{ card.text }}"
                            data:
                              tag: "breadsheet_{{ card.bake_id }}"
                              live_update: true
                              critical_text: "{{ label }}"
                              chronometer: true
                              when: "{{ as_timestamp(card.at) | int }}"
                              when_relative: false
                              progress: "{{ elapsed if elapsed is not none else -1 }}"
                              progress_max: "{{ length if length is not none else 1 }}"
                              notification_icon: mdi:bread-slice
                              color: "#B5762E"
                              # Quiet updates: Android's alert_once lets only the first one sound
                              alert_once: true
                              clickAction: "/breadsheet/{{ card.bake_id }}"
          - conditions:
              - condition: template
                value_template: "{{ verdict | trim == 'clear' }}"
            sequence:
              - repeat:
                  for_each: "{{ notify_services }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      continue_on_error: true
                      data:
                        message: clear_notification
                        data:
                          tag: "breadsheet_{{ card.bake_id }}"
